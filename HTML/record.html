<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asignación de Especialidades - Junio</title>
  <link rel="stylesheet" href="CSS/record.css">
</head>
<body>

  pene

  <h1>Asignación de días de riego - Junio</h1>

  <div class="contenedor-asignaciones" id="contenedorAsignaciones"></div>

  pene


  <h1 style="margin-top: 50px;">Recolección de Tapas</h1>
  <div class="contenedor-asignaciones">
    <form id="formTapas">
      <label for="especialidad">Especialidad:</label>
      <select id="especialidad" required>
        <option value="">Selecciona una opción</option>
        <option>Programación</option>
        <option>Puericultura</option>
        <option>Administración de Empresas</option>
        <option>Servicios de Hospedaje</option>
        <option>Electrónica</option>
        <option>Contabilidad</option>
      </select>

      <label for="grupo">Grupo:</label>
      <select id="grupo" required>
        <option value="">Selecciona un grupo</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
      </select>

      <label for="turno">Turno:</label>
      <select id="turno" required>
        <option value="">Selecciona un turno</option>
        <option>Matutino</option>
        <option>Vespertino</option>
      </select>

      <label for="cantidad">Cantidad de tapas recolectadas:</label>
      <input type="number" id="cantidad" required min="0">

      <button type="submit">Guardar</button>
    </form>
  </div>

  <div class="contenedor-asignaciones" id="resultadosTapas"></div>

  <script src="JS/record.js"></script>

</body>
</html>
