<!DOCTYPE HTML>
<HTML lang="ES">

    <link rel="stylesheet" href="Perfil_Usuario.css">

<head>
<title>Perfil Usuario(1.0)</title>
<meta charset="utf-8">
<meta name="author" content="Bravo Garcia Moises">
<meta name="description" content="Proyecto Ecosystem 1.0">
<meta name="keywords" content="documento, estructura, HTML5">    
</head>
<body>

      <div class="Formulario">
    <h2>Formulario</h2>
    <form autocomplete="off">
  <input type="text" id="nombre" placeholder="Nombre" autocomplete="off">
  <input type="email" id="correo" placeholder="Correo" autocomplete="off">
  <input type="password" id="contraseña" placeholder="Contraseña" autocomplete="new-password" >
  <input type="number" id="numero" placeholder="Número" autocomplete="off">
  <input type="file" id="foto" accept="image/*">
  <button onclick="guardarPerfil()">Guardar Perfil</button>
  <button onclick="borrarPerfil()" style="background:#dc3545;">Borrar Perfil</button>
</form>
</div>

  
  <div class="profile-container" id="perfilGuardado">
    <h2>Perfil Guardado</h2>
    <img id="fotoPerfil" src="" alt="Foto de perfil">
    <p><strong>Nombre:</strong>  <span id="mostrarNombre"></p>
    <p><strong>Correo:</strong> <span id="mostrarCorreo"></span></p>
    <p><strong>Numero:</strong> <span id="mostrarNumero"></span></p>
  </div>

  


  <script src="Perfil_Usuario.js"></script>
</body>
</HTML>
