<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión Profesional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="CSS/inisecion.css">
</head>
<body>
<div class="contenido">
    <div class="con1">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="con2">
                <input type="text" id="username" placeholder="Usuario" required>
            </div>
            <div class="con2">
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>
            <div class="con3">
                <label>
                    <input type="checkbox" id="rememberMe"> Recordarme
                </label>
                <a href="recuperar.html" class="forgot-password">¿Olvidaste la contraseña?</a>
            </div>
            <button type="submit" class="con4">Entrar</button>
        </form>
        <div class="con5">
            ¿No tienes cuenta? <a href="perfil.html">Registrarse</a>
        </div>
    </div>
</div>
<script src="JS/inisecion.js"></script>
</body>
</html>
