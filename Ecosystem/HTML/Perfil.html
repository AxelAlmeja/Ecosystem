<!DOCTYPE HTML>
<HTML lang="ES">

    <link rel="stylesheet" href="CSS/perfil.css">

<head>
<title>Perfil Usuario</title>
<meta charset="utf-8">
<meta name="author" content="Bravo Garcia Moises">
<meta name="description" content="Proyecto Ecosystem 1.0">
<meta name="keywords" content="documento, estructura, HTML5">    
</head>
<body>

    <div id="contenedor-formulario">
        <h2>Crear mi Perfil</h2>
        <form id="formulario-perfil" autocomplete="off">
            <label for="control-number">Número de Control</label>
            <input type="text" id="control-number" required
                   pattern="[0-9A-Za-z]{6,10}" 
                   title="Debe contener entre 6 y 10 caracteres alfanuméricos (letras o números).">

            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" required>

            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" required autocomplete="new-password">

            <label for="numero">Número de Contacto</label>
            <input type="tel" id="numero" required pattern="[0-9]{10}" title="Ingresa 10 dígitos">

            <label for="imagen">Foto de Perfil</label>
            <input type="file" id="imagen" accept="image/*">
            
            <button type="submit" class="boton-guardar">Guardar Perfil</button>
            <button type="button" class="boton-borrar" id="borrar-perfil-btn">Borrar Datos</button>
        </form>
    </div>

    <div id="contenedor-perfil" class="tarjeta-perfil" style="display: none;">
        <h2>Mi Perfil</h2>
        <img id="foto-perfil" src="" alt="Foto de perfil">
        <p><strong>Núm. de Control:</strong> <span id="control-number-perfil"></span></p>
        <p><strong>Correo:</strong> <span id="correo-perfil"></span></p>
        <p><strong>Número:</strong> <span id="numero-perfil"></span></p>
        <button type="button" class="boton-editar">Editar Perfil</button>
    </div>


<script src="JS/perfil.js"></script>
</body>
</HTML>
