<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="CSS/perfil.css">
</head>
<body>
    <div id="contenedor-formulario">
        <h2>Regístrate</h2>
        <form id="formulario-perfil">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" required>

            <label for="carrera">Carrera:</label>
            <select id="carrera" required>
                <option value="">Selecciona tu carrera</option>
                <option value="Programación">Programación</option>
                <option value="Admin. Empresas">Admin. Empresas</option>
                <option value="Puericultura">Puericultura</option>
                <option value="Contabilidad">Contabilidad</option>
                <option value="Ofimática">Ofimática</option>
                <option value="Servicios de hospedaje">Servicios de hospedaje</option>
            </select>

            <label>Turno:</label>
            <div style="text-align:left; margin-bottom:10px;">
                <input type="radio" id="matutino" name="turno" value="Matutino" required>
                <label for="matutino" style="display:inline;">Matutino</label>
                <input type="radio" id="vespertino" name="turno" value="Vespertino" required>
                <label for="vespertino" style="display:inline;">Vespertino</label>
            </div>

            <label for="grupo">Grupo:</label>
            <select id="grupo" required>
                <option value="">Selecciona tu grupo</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>

            <label for="imagen">Foto de perfil:</label>
            <input type="file" id="imagen" accept="image/*">

            <button type="submit">Guardar</button>
        </form>
    </div>

    <div id="contenedor-perfil" style="display: none;">
        <div class="tarjeta-perfil">
            <img id="foto-perfil" src="" alt="Foto de perfil">
            <h3 id="nombre-perfil"></h3>
            <p id="correo-perfil"></p>
            <p><strong>Carrera:</strong> <span id="carrera-perfil"></span></p>
            <p><strong>Turno:</strong> <span id="turno-perfil"></span></p>
            <p><strong>Grupo:</strong> <span id="grupo-perfil"></span></p>
            <button class="boton-editar">Editar</button>
        </div>
    </div>

    <script src="JS/perfil.js"></script>
</body>
</html>
