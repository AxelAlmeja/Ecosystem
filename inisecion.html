<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="CSS/inisecion.css">
</head>
<body>
<div class="contenido">
    <div class="con1">
        <h2>Iniciar Sesión</h2>

        <form id="loginForm">
            <div class="con2">
                <input type="text" id="username" placeholder="Usuario" required>
            </div>
            <div class="con2">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <div class="con3">
                <label>
                    <input type="checkbox" id="rememberMe"> Recordarme
                </label>
                <a href="#" class="forgot-password"></a>
            </div>
            <button type="submit" class="con4">Entrar</button>
        </form>

        <div class="con5">
            <a href="perfil.html">Registrarse</a>
        </div>
    </div>
</div>

<script src="JS/inisecion.js"></script>
</body>
</html>
